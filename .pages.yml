# Pages CMS configuration — https://pagescms.org
# Defines the editing UI at app.pagescms.org for the NOIR site.
# Editors never see code: each page is a set of labelled fields and image pickers.

media:
  input: public/assets/img      # where uploaded images are stored in the repo
  output: assets/img            # the path written into content (matches how the site loads them)
  extensions: [jpg, jpeg, png, webp, svg, avif]

settings:
  content:
    merge: false

content:
  # ---------------------------------------------------------------- GLOBAL
  - name: site
    label: "Global · Nav & Footer"
    type: file
    path: src/data/site.json
    icon: settings
    fields:
      - { name: brand, label: Brand name, type: string }
      - name: nav
        label: Navigation links
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: href, label: Link (e.g. atelier.html), type: string }
      - name: cta
        label: Header button
        type: object
        fields:
          - { name: label, type: string }
          - { name: href, type: string }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: blurb, label: Address blurb, type: text }
          - { name: houseHeading, type: string }
          - { name: commissionHeading, type: string }
          - { name: email, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: copyright, type: string }

  # ---------------------------------------------------------------- HOME
  - name: home
    label: "Home"
    type: file
    path: src/data/home.json
    icon: home
    fields:
      - name: seo
        label: Page title & description (SEO)
        type: object
        fields:
          - { name: title, type: string }
          - { name: description, type: text }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: image, label: Background image, type: image }
          - { name: imageAlt, label: Image alt text, type: string }
          - { name: eyebrow, type: string }
          - { name: title, label: Headline, type: text, description: "Wrap a word in *asterisks* for gold italic. New line = line break." }
          - { name: sub, label: Sub-text, type: text }
          - { name: ctaPrimaryLabel, label: Button text, type: string }
          - { name: ctaPrimaryHref, label: Button link, type: string }
          - { name: ctaSecondaryLabel, label: Text link, type: string }
          - { name: ctaSecondaryHref, label: Text link href, type: string }
      - name: invitation
        label: "The Invitation"
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: figtag, label: Image caption, type: string }
          - { name: eyebrow, type: string }
          - { name: lead, type: text }
          - { name: body, type: text }
          - { name: linkLabel, type: string }
          - { name: linkHref, type: string }
      - name: ritual
        label: "The Ritual (3 cards)"
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: string }
          - name: acts
            label: Cards
            type: object
            list: true
            fields:
              - { name: image, type: image }
              - { name: imageAlt, type: string }
              - { name: number, label: Label (e.g. I — III), type: string }
              - { name: title, type: string }
              - { name: desc, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }
      - name: atelierBand
        label: "The Atelier band"
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: text, description: "New line = line break." }
          - { name: body, type: text }
          - { name: sealText, label: Seal text, type: text }
          - { name: locationLabel, type: string }
          - { name: location, type: string }
          - { name: linkLabel, type: string }
          - { name: linkHref, type: string }
          - { name: image, type: image }
          - { name: imageAlt, type: string }
      - name: distinction
        label: "C-suite section"
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: figtag, label: Image caption, type: string }
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: body, type: text }
          - { name: bullets, label: Bullet points, type: string, list: true }
          - { name: linkLabel, type: string }
          - { name: linkHref, type: string }
      - name: commissions
        label: "Recent Commissions (carousel)"
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: linkLabel, type: string }
          - { name: linkHref, type: string }
          - name: cards
            label: Cards
            type: object
            list: true
            fields:
              - { name: image, type: image }
              - { name: imageAlt, type: string }
              - { name: occasion, label: Occasion tag, type: string }
              - { name: title, type: string }
              - { name: cloth, label: Cloth detail, type: string }
              - { name: tone, label: Dim & warm this photo (for bright images), type: boolean }
              - { name: href, type: string }
      - name: testimonials
        label: Testimonials
        type: object
        list: true
        fields:
          - { name: quote, type: text }
          - { name: by, label: Attribution, type: string }
      - name: cta
        label: "Closing call-to-action"
        type: object
        fields:
          - { name: image, label: Background image, type: image }
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: sub, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }

  # ---------------------------------------------------------------- ATELIER
  - name: atelier
    label: "The Atelier"
    type: file
    path: src/data/atelier.json
    icon: book-open
    fields:
      - { name: seo, type: object, fields: [{ name: title, type: string }, { name: description, type: text }] }
      - name: header
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: text, description: "New line = line break." }
          - { name: sub, type: text }
      - name: founder
        label: Founder
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: figtag, label: Image caption, type: string }
          - { name: eyebrow, type: string }
          - { name: heading, type: string }
          - { name: body, label: Paragraphs, type: text, list: true }
          - { name: pullQuote, type: text }
      - name: codes
        label: House codes
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: string }
          - name: items
            type: object
            list: true
            fields:
              - { name: number, type: string }
              - { name: title, type: string }
              - { name: desc, type: text }
      - name: space
        label: The Space (3 cards)
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: string }
          - name: items
            type: object
            list: true
            fields:
              - { name: image, type: image }
              - { name: imageAlt, type: string }
              - { name: title, type: string }
              - { name: desc, type: string }
      - name: cta
        type: object
        fields:
          - { name: image, label: Background image, type: image }
          - { name: heading, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }

  # ---------------------------------------------------------------- PROCESS
  - name: process
    label: "The Process"
    type: file
    path: src/data/process.json
    icon: list
    fields:
      - { name: seo, type: object, fields: [{ name: title, type: string }, { name: description, type: text }] }
      - name: header
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: text, description: "New line = line break." }
          - { name: sub, type: text }
      - name: acts
        label: Steps
        type: object
        list: true
        fields:
          - { name: number, type: string }
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: title, type: string }
          - { name: desc, type: text }
      - name: cta
        type: object
        fields:
          - { name: image, label: Background image, type: image }
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }

  # ---------------------------------------------------------------- COMMISSIONS
  - name: commissions
    label: "Commissions gallery"
    type: file
    path: src/data/commissions.json
    icon: image
    fields:
      - { name: seo, type: object, fields: [{ name: title, type: string }, { name: description, type: text }] }
      - name: header
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: text, description: "New line = line break." }
          - { name: sub, type: text }
      - name: filters
        label: Filter buttons
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: key, label: Key (all/business/blacktie/ceremony), type: string }
      - name: items
        label: Gallery items
        type: object
        list: true
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: occasionKey, label: Filter key (business/blacktie/ceremony), type: string }
          - { name: occasionLabel, label: Occasion tag, type: string }
          - { name: title, type: string }
          - { name: tone, label: Dim & warm this photo (for bright images), type: boolean }
      - name: cta
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }

  # ---------------------------------------------------------------- WEDDINGS
  - name: weddings
    label: "Weddings"
    type: file
    path: src/data/weddings.json
    icon: heart
    fields:
      - { name: seo, type: object, fields: [{ name: title, type: string }, { name: description, type: text }] }
      - name: hero
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: eyebrow, type: string }
          - { name: title, label: Headline, type: text, description: "Wrap a word in *asterisks* for italic. New line = line break." }
          - { name: sub, type: text }
          - { name: ctaPrimaryLabel, type: string }
          - { name: ctaPrimaryHref, type: string }
          - { name: ctaSecondaryLabel, type: string }
          - { name: ctaSecondaryHref, type: string }
      - name: invitation
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: figtag, label: Image caption, type: string }
          - { name: eyebrow, type: string }
          - { name: lead, type: text }
          - { name: body, type: text }
          - { name: linkLabel, type: string }
          - { name: linkHref, type: string }
      - name: offerings
        label: The Occasions (3 cards)
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - name: items
            type: object
            list: true
            fields:
              - { name: image, type: image }
              - { name: imageAlt, type: string }
              - { name: number, type: string }
              - { name: title, type: string }
              - { name: desc, type: text }
              - { name: href, type: string }
      - name: process
        label: Wedding process (steps)
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: sub, type: text }
          - name: steps
            type: object
            list: true
            fields:
              - { name: number, type: string }
              - { name: title, type: string }
              - { name: desc, type: text }
      - name: gallery
        label: Real Weddings gallery
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: heading, type: string }
          - name: items
            type: object
            list: true
            fields:
              - { name: image, type: image }
              - { name: imageAlt, type: string }
              - { name: occasionLabel, label: Tag, type: string }
              - { name: title, type: string }
      - name: testimonials
        type: object
        list: true
        fields:
          - { name: quote, type: text }
          - { name: by, type: string }
      - name: cta
        type: object
        fields:
          - { name: image, label: Background image, type: image }
          - { name: eyebrow, type: string }
          - { name: heading, type: text }
          - { name: sub, type: text }
          - { name: buttonLabel, type: string }
          - { name: buttonHref, type: string }

  # ---------------------------------------------------------------- APPOINTMENT
  - name: appointment
    label: "Request an Appointment"
    type: file
    path: src/data/appointment.json
    icon: mail
    fields:
      - { name: seo, type: object, fields: [{ name: title, type: string }, { name: description, type: text }] }
      - name: aside
        label: Side panel
        type: object
        fields:
          - { name: image, type: image }
          - { name: imageAlt, type: string }
          - { name: eyebrow, type: string }
          - { name: lead, type: string }
      - name: form
        type: object
        fields:
          - { name: eyebrow, type: string }
          - { name: title, type: text, description: "New line = line break." }
          - { name: reassurance, type: text }
          - { name: occasions, label: Occasion dropdown options, type: string, list: true }
          - { name: submitLabel, type: string }
          - { name: disclaimer, type: text }
      - name: confirm
        label: Confirmation message
        type: object
        fields:
          - { name: heading, type: string }
          - { name: body, type: text }
          - { name: linkLabel, type: string }
